        script: `Looking ahead to today’s session, we have prepared a comprehensive <strong>12-slide Live Interactive Solution Pitch</strong> that demonstrates the actual production-ready capabilities:<br><br>

Without further ado, I would now like to invite our executive team to transition directly into the live interactive platform to experience the future of Dynamics 365 and Copilot AI firsthand. Let us begin.`
      }
    ];

    let currentSlide = 0;

    function renderSlide() {
      const slide = slidesData[currentSlide];
      const viewport = document.getElementById('slideViewport');
      viewport.innerHTML = `<div class="slide-enter flex-1 flex flex-col justify-between h-full">${slide.renderHTML()}</div>`;

      document.getElementById('currentSlideNum').textContent = slide.id;
      document.getElementById('scriptSlideNum').textContent = slide.id;
      document.getElementById('currentSlideShortTitle').textContent = slide.shortTitle;
      document.getElementById('scriptContentText').innerHTML = slide.script;

      document.getElementById('btnPrev').disabled = currentSlide === 0;
      const nextBtn = document.getElementById('btnNext');
      if (currentSlide === slidesData.length - 1) {
        nextBtn.innerHTML = '🚀 Launch Live Deck →';
        nextBtn.className = 'px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1 shadow-sm transition-all';
        nextBtn.onclick = () => { window.location.href = 'index.html'; };
      } else {
        nextBtn.innerHTML = 'Next ▶';
        nextBtn.className = 'px-3 py-1 rounded-lg bg-blue-600 hover:bg-blue-700 text-xs font-bold text-white flex items-center gap-1 shadow-sm transition-all';
        nextBtn.onclick = nextSlide;
      }
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide();
      } else {
        window.location.href = 'index.html';
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleScriptDrawer() {
      const drawer = document.getElementById('scriptDrawer');
      const btn = document.getElementById('btnToggleScript');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        btn.innerHTML = '💬 Hide Script';
        btn.className = 'px-2.5 py-1 rounded-lg bg-sky-100 border border-sky-400 text-xs text-sky-900 font-bold transition-all';
      } else {
        drawer.classList.add('hidden');
        btn.innerHTML = '💬 Host Script';
        btn.className = 'px-2.5 py-1 rounded-lg bg-sky-50 hover:bg-sky-100 border border-sky-300 text-xs text-sky-800 font-bold transition-all';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreenIcon');
      icon.textContent = document.fullscreenElement ? '🗗' : '⛶';
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    renderSlide();
  </script>
