                    ${lang === 'en' ? '"Without further ado, let us now transition directly into the live interactive platform..."' : '"บัดนี้ ผมขออนุญาตนำพาทุกท่านเข้าสู่ระบบจำลอง เพื่อรับชมการสาธิตอย่างเต็มรูปแบบครับ..."'}

                <div class="space-y-2">
                  <a href="index.html" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500 hover:from-emerald-400 hover:to-sky-400 text-slate-950 font-black text-xs md:text-sm shadow-lg shadow-emerald-500/30 flex items-center justify-center gap-2 transition-all transform hover:scale-[1.02]">
                    <span>🚀 ${lang === 'en' ? 'Launch Live Deck (12 Slides)' : 'เข้าสู่ระบบจำลอง (Launch Live Deck)'}</span>

                  </a>

                  <div class="text-center text-[11px] text-slate-400">
                    ${lang === 'en' ? 'Or press' : 'หรือกดปุ่มลูกศร'} <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300 font-mono">Next ▶</kbd> ${lang === 'en' ? 'to launch immediately' : 'เพื่อเริ่มทันที'}

        scriptEN: `Looking ahead to today’s session, we have prepared a comprehensive <strong>12-slide Live Interactive Solution Pitch</strong> that demonstrates the actual production-ready capabilities:<br><br>

        scriptTH: `และในลำดับถัดไป เพื่อให้ทุกท่านได้เห็นภาพการทำงานจริงอย่างเป็นรูปธรรม ทางทีมงานได้จัดเตรียมแพลตฟอร์มการนำเสนอแบบ Interactive Pitch Deck จำนวน 12 สไลด์ ที่จำลองการทำงานจริงอย่างละเอียดครับ<br><br>

บัดนี้ ผมขออนุญาตนำพาทุกท่านเข้าสู่ระบบจำลองผ่านลิงก์โครงการ เพื่อร่วมทดสอบและสัมผัสประสบการณ์แห่งอนาคตของ Dynamics 365 และ Copilot AI ไปพร้อมกันได้ ณ บัดนี้ครับ ขอเรียนเชิญทุกท่านครับ`
      }
    ];

    let currentSlide = 0;

    function renderSlide() {
      const slide = slidesData[currentSlide];
      const viewport = document.getElementById('slideViewport');
      viewport.innerHTML = `<div class="slide-enter flex-1 flex flex-col justify-between h-full">${slide.renderHTML(currentLang)}</div>`;

      document.getElementById('currentSlideNum').textContent = slide.id;
      document.getElementById('scriptSlideNum').textContent = slide.id;
      document.getElementById('currentSlideShortTitle').textContent = currentLang === 'en' ? slide.shortTitleEN : slide.shortTitleTH;
      
      const scriptText = currentLang === 'en' ? slide.scriptEN : slide.scriptTH;
      document.getElementById('scriptContentText').innerHTML = scriptText;
      document.getElementById('scriptLangBadge').textContent = currentLang === 'en' ? '🇬🇧 English' : '🇹🇭 ภาษาไทย';

      document.getElementById('btnPrev').disabled = currentSlide === 0;
      const nextBtn = document.getElementById('btnNext');
      if (currentSlide === slidesData.length - 1) {
        nextBtn.innerHTML = currentLang === 'en' ? '🚀 Launch Live Deck →' : '🚀 เข้าสู่ Live Deck →';
        nextBtn.className = 'px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1 shadow-md shadow-emerald-900/40 transition-all';
        nextBtn.onclick = () => { window.location.href = 'index.html'; };
      } else {
        nextBtn.innerHTML = 'Next ▶';
        nextBtn.className = 'px-3 py-1 rounded-lg bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white flex items-center gap-1 shadow-md shadow-sky-900/40 transition-all';
        nextBtn.onclick = nextSlide;
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      const btnEN = document.getElementById('btnLangEN');
      const btnTH = document.getElementById('btnLangTH');
      const label = document.getElementById('scriptBtnLabel');
      if (lang === 'en') {
        btnEN.className = "px-2 py-0.5 rounded-md text-xs font-semibold transition-all bg-sky-600 text-white shadow";
        btnTH.className = "px-2 py-0.5 rounded-md text-xs font-semibold transition-all text-slate-300 hover:text-white";
        label.textContent = "Host Script";
      } else {
        btnTH.className = "px-2 py-0.5 rounded-md text-xs font-semibold transition-all bg-red-600 text-white shadow";
        btnEN.className = "px-2 py-0.5 rounded-md text-xs font-semibold transition-all text-slate-300 hover:text-white";
        label.textContent = "บทพูดพิธีกร";
      }
      renderSlide();
    }

    function switchScriptLang() {
      setLanguage(currentLang === 'en' ? 'th' : 'en');
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide();
      } else {
        window.location.href = 'index.html';
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleScriptDrawer() {
      const drawer = document.getElementById('scriptDrawer');
      const btn = document.getElementById('btnToggleScript');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        btn.innerHTML = currentLang === 'en' ? '💬 Hide Script' : '💬 ซ่อนบทพูด';
        btn.className = 'px-2.5 py-1 rounded-lg bg-sky-600/30 border border-sky-400 text-xs text-sky-200 font-bold transition-all';
      } else {
        drawer.classList.add('hidden');
        btn.innerHTML = currentLang === 'en' ? '💬 Host Script' : '💬 บทพูดพิธีกร';
        btn.className = 'px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 font-semibold transition-all';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreenIcon');
      icon.textContent = document.fullscreenElement ? '🗗' : '⛶';
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    // Default start with English
    setLanguage('en');
  </script>
</body>
